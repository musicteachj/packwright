# A database for `npm run dev`.
#
# The tests do not use this. They start their own `mongod` through
# mongodb-memory-server, so `npm test`, `npm run verify:build` and the browser
# suite all run on a clean checkout with no Docker installed. This exists for the
# one case that genuinely wants a database outliving the process that used it:
# developing against data you put there yourself.
#
# `docker compose up -d` still starts only Mongo. `docker compose --profile prod
# up -d --build` adds the production image, on its own database
# (packwright_prodlike) so its indexes are built fresh.
services:
  mongo:
    image: mongo:8
    # Bound to the loopback address. `'27017:27017'` publishes on 0.0.0.0, which
    # puts an unauthenticated database on every interface the machine has — a
    # coffee-shop network included. Nothing outside this machine needs it.
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - packwright-mongo:/data/db
  app:
    profiles: ['prod']
    build: .
    image: packwright:local
    platform: linux/amd64
    depends_on: [mongo]
    ports:
      - '127.0.0.1:8080:3000'
    # The public path as production runs it, with nothing that can spend money. The
    # Anthropic key is a dummy that is never called, because the budget is fixed at 0
    # here rather than read from a variable: the ledger refuses every live read before
    # the model is asked. A real key here would be a paid run, which needs James's OK.
    environment:
      MONGODB_URI: mongodb://mongo:27017/packwright_prodlike
      ANTHROPIC_API_KEY: sk-ant-local-dummy-never-called
      AI_MONTHLY_BUDGET_USD: '0'
      AUDIT_PUBLIC: 'true'
      # Cloudflare's public test keys: the site key and the secret that always pass.
      TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      # The only reason production starts with the test keys: every host is local.
      TURNSTILE_HOSTNAMES: localhost
      # A fixed local dummy, used only here and not a secret. Production's lives in SSM.
      AUDIT_IP_HASH_KEY: local-only-not-a-secret-0123456789abcdef
      TRUST_PROXY_HOPS: '1'
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 768m
    stop_grace_period: 30s

volumes:
  packwright-mongo:
