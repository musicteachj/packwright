name: CI

on:
  # `dev` is the integration branch — every feature branch is cut from it and
  # merged back to it, so it is where work actually lands and where CI needs to
  # run. `main` stays listed because it is the release branch: dormant for now,
  # but a push to it should never be the one thing nobody checked.
  push:
    branches: ['main', 'dev']
  # No branch filter: this covers every pull request, including feature -> dev.
  pull_request:
  workflow_dispatch:

# Read-only by default: no step here writes to the repository, so the token
# GitHub hands each job gets nothing more.
permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        # Pinned by commit, with the version as a comment: a tag can be moved to
        # other code, a commit cannot. These are Open Door's vetted pins.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # `npm ci` installs from the lockfile without re-resolving the dependency
      # graph, which is both faster and reproducible.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # vue-tsc, not bare tsc — plain tsc reads an SFC's script block and stops,
      # so template type errors would sail through this step.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # Exercises the PDF export against the *built* artifact, not the source
      # tree. The whole suite once passed while `npm start` answered the first
      # export with a 500, because the fonts resolved from src/ and not from the
      # bundle. Tests alone could not see that; only running what ships can.
      - name: Verify the built server
        run: npm run verify:build

      # Everything above this line runs in jsdom or against curl. jsdom has no
      # layout engine and does not execute the bundle under a Content-Security-
      # Policy, so it cannot say whether an element is visible, what it measures,
      # or whether the page runs at all under the headers the server sends. These
      # are the handful of claims that need a browser to make.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # `playwright.config.ts` builds before it serves, which repeats the build
      # step above. That is deliberate: the alternative is a browser run that
      # silently tests whatever artifact happened to be lying around, which is the
      # exact trap `verify:build` was fixed for.
      - name: Browser tests
        run: npm run test:e2e

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Deploys main to the shared portfolio cluster once everything above has passed. A run by hand
  # on main (workflow_dispatch) redeploys the current commit without a new one: the monthly image
  # rebuild and the restore runbook use it. Either way it waits for James's approval on the
  # `production` environment, and only this job can ask GitHub for an AWS token.
  deploy:
    name: Deploy to production
    needs: [verify]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    # The budget: the build (about 5 to 8 minutes), a setup task's wait of up to about 10, the
    # wait for the service to settle of up to 30, and the smoke checks (a few minutes at most).
    # That stays under 55, which is inside the one-hour session configure-aws-credentials asks
    # for by default, so the AWS credentials cannot expire partway through.
    timeout-minutes: 55
    environment: production
    permissions:
      contents: read
      id-token: write
    # One deploy at a time: a running deploy is never canceled. GitHub keeps at most one pending
    # run per group, though, so a newer run replaces an older pending one (a push can drop a
    # redeploy by hand that is still waiting for approval).
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # OIDC: the role trusts this repository's `production` environment and nothing else, so
      # no AWS key is stored anywhere.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/packwright-deploy
          aws-region: us-east-1

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0

      # The tag is the commit, the run and the attempt: a run by hand rebuilds the same commit, and
      # "Re-run jobs" keeps the run id, so the attempt makes each tag new. The ECR repository is
      # mutable, so a reused tag would overwrite the image an older task definition revision names.
      # It still starts with the commit, which portfolio-infra's revision check reads.
      # --provenance=false and --sbom=false keep buildx from pushing an image index with untagged
      # attestation manifests beside the image. ECR's scan on push and the keep-5 lifecycle rule both
      # need exactly one plain image manifest per tag.
      - name: Build and push the image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/portfolio/packwright:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker buildx build --platform linux/amd64 --provenance=false --sbom=false --push -t "$IMAGE" .

      # Registers the task definition, creates or updates the service, waits for it to settle on
      # this release, and runs the smoke checks (deploy/deploy.sh says how each step fails).
      - name: Deploy
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/portfolio/packwright:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          ALB_DNS_NAME: ${{ vars.ALB_DNS_NAME }}
          TARGET_GROUP_ARN: ${{ vars.TARGET_GROUP_ARN }}
        run: deploy/deploy.sh "$IMAGE"
