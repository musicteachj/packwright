name: CI

on:
  # `dev` is the integration branch — every feature branch is cut from it and
  # merged back to it, so it is where work actually lands and where CI needs to
  # run. `main` stays listed because it is the release branch: dormant for now,
  # but a push to it should never be the one thing nobody checked.
  push:
    branches: ['main', 'dev']
  # No branch filter: this covers every pull request, including feature -> dev.
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # `npm ci` installs from the lockfile without re-resolving the dependency
      # graph, which is both faster and reproducible.
      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # vue-tsc, not bare tsc — plain tsc reads an SFC's script block and stops,
      # so template type errors would sail through this step.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # Exercises the PDF export against the *built* artifact, not the source
      # tree. The whole suite once passed while `npm start` answered the first
      # export with a 500, because the fonts resolved from src/ and not from the
      # bundle. Tests alone could not see that; only running what ships can.
      - name: Verify the built server
        run: npm run verify:build

      # Everything above this line runs in jsdom or against curl. jsdom has no
      # layout engine and does not execute the bundle under a Content-Security-
      # Policy, so it cannot say whether an element is visible, what it measures,
      # or whether the page runs at all under the headers the server sends. These
      # are the handful of claims that need a browser to make.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # `playwright.config.ts` builds before it serves, which repeats the build
      # step above. That is deliberate: the alternative is a browser run that
      # silently tests whatever artifact happened to be lying around, which is the
      # exact trap `verify:build` was fixed for.
      - name: Browser tests
        run: npm run test:e2e

      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
