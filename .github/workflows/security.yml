name: Security

on:
  push:
    branches: ['main', 'dev']
  pull_request:
  # Weekly, so a newly published vulnerability in an unchanged dependency still
  # surfaces. GitHub runs a schedule, and offers the manual run, only from the
  # default branch, `main`, so both start once a release brings this file there,
  # and then audit what `main` ships.
  schedule:
    - cron: '0 13 * * 1'
  workflow_dispatch:

# Runs for a pull request share a group, so a newer push cancels the older run.
# Each push to dev or main gets its own group, its commit, so no merge's run is
# ever canceled or left waiting.
concurrency:
  group: security-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Leaked secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # scan the whole history, not just the latest commit
      # The tarball is checked against a SHA-256 written here, not against the
      # checksums file of the same release, which whoever could replace the
      # tarball could replace too. Read on 2026-11-22 from the release's checksums
      # file, and matched by the downloaded tarball and by GitHub's own digest of
      # the asset. A version bump changes both lines.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
      - name: Scan every commit
        run: ./gitleaks git --redact --verbose --exit-code 1

  dependencies:
    name: Vulnerable dependencies (npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      # npm audit reads package-lock.json, so no install is needed. It fails on
      # any high or critical advisory, in run-time and build-time dependencies
      # alike.
      - name: Audit the locked dependencies
        run: npm audit --audit-level=high
