<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Packwright · packaging label compliance</title>
    <meta
      name="description"
      content="Generate print-accurate GS1, GHS and FDA packaging labels, and see exactly which rule a label breaks."
    />
    <!--
      The mark, from `docs/design/logo/`. The SVG switches ink with the browser's
      theme; Safari ignores SVG favicons and takes the PNG. The PNG is named first
      and the SVG last, the order in which browsers that can draw an SVG icon
      choose it over a sized raster one.
    -->
    <link rel="icon" href="/icon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#14120f" />
    <!--
      Link previews. A crawler that draws one runs no script and resolves nothing
      against the page, so these are here rather than set by the client, and every
      address is absolute. The description is the one above; the image is
      `public/og-image.png`, at its own size (`src/linkPreview.test.ts`).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Packwright" />
    <meta property="og:title" content="Packwright · packaging label compliance" />
    <meta
      property="og:description"
      content="Generate print-accurate GS1, GHS and FDA packaging labels, and see exactly which rule a label breaks."
    />
    <meta property="og:url" content="https://packwright.jameslittlefield.net/" />
    <meta property="og:image" content="https://packwright.jameslittlefield.net/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Packwright: print-accurate packaging labels, checked against the regulation, with a citation for every finding."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
